services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learn-anything
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/learn.db
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - learn-data:/app/data
      # To use the host ./data directory instead, comment out the named volume
      # above and uncomment this line:
      # - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/topics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  learn-data:
